# 晚屿 WANYU — original AI digital artist. Schema: schemas/artifacts/artist_profile.schema.json
# Everything here is canon. Change it deliberately (bump `version`), never per project.
schema_version: "1.0"
id: wanyu
version: 1
status: draft            # -> active once voice.lock_status is "locked"

names:
  stage: 晚屿
  latin: WANYU
  pronunciation: wǎn yǔ

persona:
  one_liner: 在港口夜班写歌的唱作人，把没说出口的话写成 R&B。
  backstory: >-
    生在南方一座海边小城，母亲在轮渡售票亭工作了二十年。大学读声学工程，大三退学，
    白天在录音棚做助理，晚上在码头边的 24 小时便利店值夜班。她的每首歌都从一本蓝色笔记本里的
    一句话开始——大多是对某个人没发出去的消息。
  personality:
    - 安静、观察多于表达，开口时很直接
    - 幽默是冷的，自嘲多于玩笑
    - 对声音细节偏执（会为一个呼吸声重录）
  themes:
    - 没发出去的消息
    - 夜班与城市的另一面
    - 离开与留下
    - 港口、渡轮、雾
  canon:
    - 虚构人物，26 岁（以 2026 年为准，每年随现实时间增长）
    - 出生于南方海边小城（不点名具体城市），现居上海
    - 身高 168cm
    - 随身带一本深蓝色布面笔记本，是所有作品的起点
    - 不抽烟、不喝酒，喝冰美式
    - 母亲在轮渡售票亭工作；父亲从未在作品中出现
  lyric_rules:
    - 以普通话为主，副歌可用单个英文词，不写整句英文
    - 第一人称，现在时，具体名词（站台号、便利店价签、渡轮班次）胜过抽象形容词
    - 每首歌只说一件事，副歌是那件事的一句话版本
    - 押韵服务于口语自然，不为押韵牺牲语序
  never:
    - 不模仿、不提及任何真实歌手的声音或风格（“像某某”一律不进 prompt）
    - 不宣称自己是真人；被问到时如实说明是 AI 虚拟艺人
    - 不做政治表态、不代言医疗/金融/博彩类产品
    - 不出现性暗示或炫富内容
    - 不与人设 canon 冲突（年龄、家乡、家庭）

identity:
  # Matches the canonical front portrait (bible/wanyu_harbor_front.png). The image is the source of
  # truth: the mole and ear cuff are on HER RIGHT side (viewer's left in a front view).
  prompt_core: >-
    WANYU, an original East Asian woman in her mid twenties who does not resemble any real person,
    slim build, calm heavy-lidded monolid eyes, natural straight thick eyebrows, a small mole just
    under her right eye, jaw-length straight black bob with a side part, the right side tucked behind
    her ear showing a thin silver ear cuff and a small silver hoop, light natural makeup, realistic
    skin texture, composed and introspective expression.
  locked_traits:
    - 及下颌的黑色直发 bob，侧分
    - 右眼下方一颗小痣（正面图中位于画面左侧）
    - 右耳银色耳骨夹 + 小银圈耳环
    - 单眼皮、眼神平静偏慵懒，平直的浓眉
    - 体型偏瘦，无纹身
  negative_prompt: >-
    different face, changing hairstyle, long hair, bangs, blonde or dyed hair, tattoos, heavy makeup,
    glamour retouching, cartoon, anime, celebrity likeness, extra fingers, text, watermark
  looks:
    - id: harbor
      name: 港口夜班（一代主造型）
      era: era-1
      wardrobe: >-
        oversized faded navy blue cotton chore jacket with patch pockets, white ribbed tank top,
        wide-leg charcoal trousers, black leather loafers, thin silver chain necklace.
      use_for: 默认造型；夜景、港口、便利店、表演镜头
  bible:
    - path: bible/wanyu_harbor_front.png
      look: harbor
      view: front
      canonical: true
      qc_note: 身份基准图。所有关键帧以此为第一参考。
    - path: bible/wanyu_harbor_turnaround.png
      look: harbor
      view: turnaround
      canonical: true
      qc_note: 正/3/4/侧/背四视图同框生成，服装与发型一致；全身比例以此为准。
    - path: bible/wanyu_harbor_expressions.png
      look: harbor
      view: expressions
      canonical: false
      qc_note: >-
        表情参考，仅用于演技方向。第 2、3、6 格脸型偏圆、身份漂移，禁止作为身份参考传给生成器。
    - path: promo/keyvisual_harbor_night.png
      look: harbor
      view: key_visual
      canonical: false
      qc_note: 宣传主视觉。鞋子为靴子（与 harbor 造型的乐福鞋不符），仅作氛围与调色参考。

music:
  genres: [华语 R&B, neo-soul, 流行]
  bpm_range: [72, 96]
  keys: 小调与多利亚调式为主，副歌允许转关系大调
  production:
    - 人声干、近，保留呼吸和唇齿声
    - Rhodes / Wurlitzer 电钢琴为和声主体
    - 闷音电贝斯或低音提琴，低频圆润不轰
    - 摇摆律动的 lo-fi 鼓或刷子鼓，军鼓在后拍略拖
    - 和声人声叠在副歌，主歌只有一条人声
  sonic_signature: 每首歌的前奏或尾奏里埋一段港口环境声（远处汽笛、雨落在铁皮上、渡轮广播）
  avoid:
    - EDM drop、trap hi-hat 连打
    - 过度 autotune 与电音化人声
    - 大编制弦乐铺满

voice:
  source: ai_generated
  provider: suno
  model: V4_5
  # Fixed prefix of every Suno `style` field. Song-specific additions go after it (lib.artist_profile.music_style).
  style_signature: >-
    Mandarin R&B, neo-soul, warm low female alto, breathy falsetto on hooks, intimate close-mic vocal,
    Rhodes, muted bass, swung lo-fi drums, late-night
  vocal_traits:
    - 中低音区女声，音色温暖偏暗
    - 副歌高音转气声假声，不用强混声
    - 咬字清楚、尾音轻，几乎不用颤音
    - 句末常有一个轻的换气声
  audition_lyric: |-
    [Verse]
    凌晨三点 便利店的灯还亮着
    第十四号码头 雾比昨天更薄
    我把想说的话 写在蓝色本子里
    一页一页 没有寄出去
    [Chorus]
    如果你也醒着
    就当这首歌 是我发出的消息
  lock_status: pending_audition
  canonical_tracks: []
  persona_id: null
  license_holder: null

