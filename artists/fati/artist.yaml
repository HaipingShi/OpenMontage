music:
  genres:
  - 华语独立民谣
  - downtempo
  - 电子
  bpm_range:
  - 78
  - 118
  keys: 小调与弗里吉亚调式为主，副歌常回到关系大调
  production:
  - 卡林巴、手鼓（frame drum）、温暖的模拟合成器铺底
  - 用她自己哼唱的人声切片做节奏和过门
  - 动的歌：碎拍（broken beat）和慢速 house 律动
  - 静的歌：只有卡林巴、合成器长音和人声
  - 和声由她自己叠三层
  sonic_signature: 每首歌都有一段不带歌词的哼唱动机，在尾奏再出现一次
  avoid:
  - EDM drop
  - 过度 autotune 与电音化人声
  - 把民族乐器当"异域风情"拼贴
