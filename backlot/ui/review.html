<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>镜头审核 · OpenMontage</title><link rel="stylesheet" href="/ui/review.css"></head>
<body><header><div><a class="brand" href="/">OPENMONTAGE <span> / 人工审片</span></a><h1 id="title">镜头审核</h1></div><div class="header-actions"><a id="download-all" hidden>下载全部视频</a><span id="progress">正在读取素材…</span><button id="export">导出标注</button><button id="submit" class="primary">完成标注，交给 Agent</button></div></header>
<div id="notice" role="status" aria-live="polite">标注时间从每段原始素材的 0 秒开始，编辑自动保存到项目。</div>
<main><aside class="rail"><div class="rail-heading"><h2>已生成素材</h2><select id="filter" aria-label="筛选素材"><option value="all">全部</option><option value="unreviewed">未标注</option><option value="issues">有问题</option><option value="approved">通过</option></select></div><nav id="shots" aria-label="镜头列表"></nav></aside>
<section class="viewer"><div class="viewer-title"><div><span class="eyebrow" id="section"></span><h2 id="shot-title">选择镜头</h2></div><a id="download" download>下载原始视频</a></div><div class="screen"><video id="video" controls preload="none" playsinline></video><button id="load-video" class="load-video">点击加载并播放</button></div>
<div class="transport"><button id="previous" title="上一个镜头">← 上一段</button><button id="step-back" title="向前定位0.05秒">−0.05s</button><output id="clock">00:00.00</output><button id="step-forward" title="向后定位0.05秒">+0.05s</button><button id="next" title="下一个镜头">下一段 →</button></div>
<p id="intent" class="intent"></p><details class="references"><summary>对照参考图与生成提示词</summary><div id="reference-images"></div><pre id="prompt"></pre></details><div class="help">先播放定位，再点击右侧「标记当前时间」。可以连续记录多个问题；编辑会自动保存。播放由你操作，页面不会自动播放下一段。</div></section>
<section class="editor"><div class="editor-heading"><h2>你的审核</h2><span id="save-state" role="status" aria-live="polite">已加载</span></div><label class="field">整体结论<select id="verdict"><option value="unreviewed">未标注</option><option value="approved">通过</option><option value="trimmable">裁切后可用</option><option value="rejected">需要重做</option></select></label><div class="issue-actions"><button id="mark-time" class="primary">＋ 标记当前时间</button><button id="mark-whole">＋ 整段问题</button></div><div id="issue-list"></div><div id="issue-editor" hidden><div class="issue-heading"><h3>问题标注</h3><button id="delete-issue" class="danger">删除本条</button></div><div class="times"><label class="field">开始（秒）<input id="start" type="number" min="0" step="0.01" placeholder="整段"></label><label class="field">结束（秒，可选）<input id="end" type="number" min="0" step="0.01" placeholder="单点"></label></div><button id="capture-end">以当前播放位置作为结束点</button><label class="field">严重程度<select id="severity"><option value="minor">轻微 · 可接受或剪辑修补</option><option value="major">明显 · 影响使用</option><option value="blocking">严重 · 无法使用</option></select></label><fieldset><legend>问题类型（可多选）</legend><div id="categories"></div></fieldset><label class="field">看到了什么<textarea id="note" maxlength="4000" rows="4" placeholder="例如：2.3秒开始，人物回头时脸变成了另一个人。"></textarea></label><label class="field">希望怎么改<textarea id="desired-change" maxlength="4000" rows="3" placeholder="例如：保持首帧的脸，只转动视线；删掉大幅回头。"></textarea></label></div><p id="empty-issues" class="muted">暂无问题标注。可以直接选择通过，或添加问题。</p><button id="save-now" class="wide">立即保存</button><button id="reload" class="wide" hidden>重新读取项目中的标注（保留本机草稿）</button><p class="storage">标注写入本项目 reviews/shot_reviews.json。完成标注只提交反馈。</p></section></main><script type="module" src="/ui/review.js"></script></body></html>
